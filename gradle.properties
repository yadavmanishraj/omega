android.useAndroidX=true
# AGP 9 integrates Kotlin (built-in Kotlin); Omega's build-logic applies the
# Kotlin Gradle plugin itself via its convention plugins, so opt out of the
# built-in for now (staged migration — this escape hatch is removed in AGP 10,
# at which point the convention plugins move to built-in Kotlin).
android.builtInKotlin=false
kotlin.code.style=official
android.nonTransitiveRClass=true
# 17 modules compile as parallel subgraphs (features depend only on
# core), so give the daemon room to actually run them concurrently -
# 2g starves parallel Kotlin/KSP workers on a project this size.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Kotlin compile daemon gets its own heap for the same reason.
kotlin.daemon.jvmargs=-Xmx2g
# Compile independent modules/tasks in parallel and reuse task outputs
# across builds via the local build cache.
org.gradle.parallel=true
org.gradle.caching=true
# Incremental Kotlin + KSP are on by default; stated explicitly so the
# parallelism setup is visible in one place.
kotlin.incremental=true
ksp.incremental=true
