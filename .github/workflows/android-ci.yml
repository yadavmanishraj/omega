name: Android CI

# Triggers: every push to main, every pull request targeting main, and manual runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK (platform 35 + build-tools 35) on the runner.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      # NOTE: use `gradle` directly, NOT ./gradlew.
      # CI installs the pinned Gradle 8.9 distribution instead of relying
      # on the wrapper. Root-level tasks (lintDebug / testDebugUnitTest /
      # assembleDebug) fan out across all 17 modules automatically.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint (debug)
        run: gradle lintDebug --stacktrace

      - name: Unit tests and debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            */build/reports/tests/testDebugUnitTest/
            */build/test-results/testDebugUnitTest/
            */*/build/reports/tests/testDebugUnitTest/
            */*/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            */build/reports/lint-results-debug.*
            */*/build/reports/lint-results-debug.*
          if-no-files-found: warn
